<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #loadingDiv{
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}
    #loadingDiv img{
        height: 150px;
        filter: brightness(60%) saturate(2);
    }
    .test{
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: block;
        height: 200px;
        width: 200px;
        font-size: 150px;
        background-color: rgb(60, 141, 60);
        text-align: center;
        color: rgba(0, 0, 0, 0.25);
    }
    body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f0f0f0;
}

.grid {
    display: grid;
    grid-template-columns: repeat(10, 40px); /* Adjust the number of columns and size */
    gap: 5px;
}

.square {
    width: 35px;
    height: 35px;
    background-color: #3498db;
    border: 1px solid #2980b9;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    position: relative;
    transition: all 0.5s ease;
}

.cleared {
    animation: popOutFaded 0.5s ease-in-out forwards;
}


@keyframes popOutFaded {
            0% {
                transform: rotate(0deg);
                scale: 1;
                opacity: 1;
                top: 0;
                left: 0;
            }

            20% {
                transform: rotate(36deg);
                opacity: 0.8;
                top: -30px;
                left: 20px;
            }

            50% {
                transform: rotate(90deg);
                opacity: 0.6;
                top: -50px;
                left: 40px;
            }

            80% {
                transform: rotate(144deg);
                opacity: 0.4;
                top: -30px;
                left: 60px;
            }
            99%{
            }
            100% {
                transform: rotate(180deg);
                opacity: 0;
                top: 0;
                left: 80px;
                scale: 0.4;
            }
        }



        </style>
        <script>
            function clearSquare(square) {
                square.classList.add('cleared');
                setTimeout(() => {
                    square.style.visibility = 'hidden'; // Optionally hide the square after the animation
                }, 1000); // Match the timeout duration with the animation duration
            }

        </script>
</head>
<body>
    <!--div id="loadingDiv">
        <img src="design/spin.gif" alt="Loading...">
    </div-->
    <!--div class="test">
        &#9673;
    </div-->
    <div class="grid">
        <div class="square" onclick="clearSquare(this)"></div>
    </div>
</body>

</html>
